version: 0.2

phases:
  install:
    runtime-versions:
      php: 8.2
    commands:
      - echo "Installing dependencies"
      - composer install

  build:
    commands:
      - echo "Running build steps"
      - php artisan config:cache
      - php artisan route:cache

  post_build:
    commands:
      - echo "Build completed"

artifacts:
  files:
    - '**/*'